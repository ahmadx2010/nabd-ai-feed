name: claude-editor
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
concurrency:
  group: news
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NABD_DATA: ${{ github.workspace }}/data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ahmadx2010/nabd-ai
          ssh-key: ${{ secrets.CODE_KEY }}
          path: code
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - run: python code/collector/todo.py
      - name: Claude
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "$(cat code/collector/claude_prompt.md)" --model sonnet --max-turns 80 \
            --allowedTools "WebSearch,WebFetch,Read,Write,Edit" --output-format text | tail -20
      - run: python code/collector/collect.py --merge-only
      - name: Commit
        run: |
          git config user.name "nabd-bot"
          git config user.email "nabd-bot@users.noreply.github.com"
          git add data/news.json data/seen.json
          git diff --cached --quiet && exit 0
          git commit -q -m "claude edit $(date -u +%H:%M)"
          git pull -q --rebase && git push -q
