name: collect-news
# GitHub's cron is best-effort and often skips hours, so each run collects 6 times
# (every 10 minutes), starts the hourly Claude job, then starts the next run itself.
# The cron below only restarts the chain if it ever breaks.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
concurrency:
  group: collect
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      NABD_DATA: ${{ github.workspace }}/data
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/checkout@v4
        with:
          repository: ahmadx2010/nabd-ai
          ssh-key: ${{ secrets.CODE_KEY }}
          path: code
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q google-auth requests
      - name: Collect every 10 minutes
        env:
          FCM_SA: ${{ secrets.FCM_SA }}
        run: |
          git config user.name "nabd-bot"
          git config user.email "nabd-bot@users.noreply.github.com"
          for i in 1 2 3 4 5 6; do
            git pull -q --rebase || git reset -q --hard origin/main
            (cd code && git pull -q) || true
            before=$(git rev-parse HEAD)
            python code/collector/collect.py || true
            python code/collector/push_fcm.py || true
            bash code/collector/push.sh "news $(date -u +%H:%M)" "python code/collector/collect.py" || true
            [ "$(git rev-parse HEAD)" = "$before" ] || gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" || true
            [ "$i" = 6 ] || sleep 540
          done
      - name: Hourly Claude editor
        if: always()
        run: gh workflow run claude.yml --repo "$GITHUB_REPOSITORY" || true
      - name: Start the next run
        if: always()
        run: gh workflow run collect.yml --repo "$GITHUB_REPOSITORY"
