name: collect-news
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
concurrency:
  group: news
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NABD_DATA: ${{ github.workspace }}/data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ahmadx2010/nabd-ai
          ssh-key: ${{ secrets.CODE_KEY }}
          path: code
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python code/collector/collect.py
      - name: Commit
        run: |
          git config user.name "nabd-bot"
          git config user.email "nabd-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -q -m "news $(date -u +%H:%M)"
          git pull -q --rebase && git push -q
